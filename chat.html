<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento | Rede Ressoar</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#faf8f5] text-slate-800 h-screen flex flex-col justify-between font-sans">
    <!-- Header minimalista -->
    <header class="bg-white border-b border-slate-200 p-4 text-center shadow-sm">
        <h1 class="font-bold text-lg text-[#064790]">Rede Ressoar & Ecovila Cora</h1>
        <p class="text-xs text-slate-500">Assistente Virtual de Atendimento</p>
    </header>

    <!-- Caixa de mensagens -->
    <main id="chat-box" class="flex-1 max-w-2xl w-full mx-auto p-4 overflow-y-auto space-y-4">
        <div class="flex items-start space-x-2">
            <div class="bg-white border border-slate-200 p-3 rounded-2xl shadow-sm max-w-[80%] text-sm leading-relaxed">
                Olá! Seja bem-vindo à Rede Ressoar. Como posso te ajudar com nossas iniciativas de bioconstrução, permacultura ou visitas à ecovila hoje?
            </div>
        </div>
    </main>

    <!-- Input de envio -->
    <footer class="bg-white border-t border-slate-200 p-4 shadow-sm">
        <form id="chat-form" class="max-w-2xl mx-auto flex gap-2" onsubmit="enviarMensagem(event)">
            <input type="text" id="user-input" placeholder="Digite sua dúvida..." autocomplete="off"
                class="flex-1 border border-slate-300 rounded-xl px-4 py-2 focus:outline-none focus:border-[#064790] text-sm bg-slate-50">
            <button type="submit" class="bg-[#064790] text-white px-5 py-2 rounded-xl text-sm font-medium hover:opacity-90 transition">
                Enviar
            </button>
        </form>
    </footer>

    <script>
        async function enviarMensagem(e) {
            e.preventDefault();
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const texto = input.value.trim();
            if (!texto) return;

            // Adiciona a mensagem do usuário na tela
            chatBox.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-[#064790] text-white p-3 rounded-2xl max-w-[80%] text-sm shadow-sm">
                        ${escapeHtml(texto)}
                    </div>
                </div>
            `;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Indicador de "digitando..."
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div id="${loadingId}" class="flex items-start space-x-2">
                    <div class="bg-white border border-slate-200 p-3 rounded-2xl shadow-sm text-sm text-slate-400 animate-pulse">
                        Digitando...
                    </div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Chamada para a API interna em Go (rota /api/chat)
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: texto })
                });
                
                document.getElementById(loadingId).remove();

                if (!res.ok) throw new Error('Erro na resposta do servidor');

                const data = await res.json();
                
                // Adiciona a resposta da IA na tela
                chatBox.innerHTML += `
                    <div class="flex items-start space-x-2">
                        <div class="bg-white border border-slate-200 p-3 rounded-2xl shadow-sm max-w-[80%] text-sm leading-relaxed">
                            ${escapeHtml(data.reply || 'Sem resposta')}
                        </div>
                    </div>
                `;
            } catch (err) {
                document.getElementById(loadingId)?.remove();
                chatBox.innerHTML += `
                    <div class="flex items-start space-x-2">
                        <div class="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-2xl shadow-sm max-w-[80%] text-sm">
                            (Modo de Teste Local) O backend em Go não respondeu na rota <code>/api/chat</code>. Quando subir o servidor em Go, esta caixinha conectará perfeitamente!
                        </div>
                    </div>
                `;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
